name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: swift --version
      - name: Test quantitative engine
        run: swift test
      - name: Build release app
        run: ./Scripts/build_app.sh
      - name: Create DMG
        run: ./Scripts/create_dmg.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict --verbose=2 dist/ItoCanvas.app
      - name: Upload DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ItoCanvas-macOS
          path: dist/ItoCanvas.dmg
          if-no-files-found: error

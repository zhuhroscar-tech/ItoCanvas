name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Toolchain
        run: swift --version
      - name: Test quantitative engine
        run: swift test
      - name: Build release app
        run: ./Scripts/build_app.sh
      - name: Create DMG
        run: ./Scripts/create_dmg.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict --verbose=2 dist/ItoCanvas.app
      - name: Upload DMG
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ItoCanvas-macOS
          path: dist/ItoCanvas.dmg
          if-no-files-found: error
